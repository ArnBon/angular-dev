<div class="row">


  <div class="col-lg-6">
    <div class="card">
      <div class="card-body">
        <h4 class="card-title">Sample Form with the Icons</h4>
        <h6 class="card-subtitle">made with bootstrap elements</h6>

        <form class="form p-t-20"
              [formGroup]="perfilForm"
              (submit)="actualizarPerfil()">


        <div class="form-group">
          <label for="exampleInputuname">User Name</label>
          <div class="input-group">
            <div class="input-group-addon"><i class="ti-user"></i></div>
            <input type="text"
              class="form-control"
              id="exampleInputuname"
              placeholder="Nombre del usuario"
              formControlName="nombre">
          </div>
        </div>


          <div class="form-group">
            <label for="exampleInputEmail1">Email address</label>
            <div class="input-group">
              <div class="input-group-addon"><i class="ti-email"></i></div>
              <input type="email"
                 class="form-control"
                 id="exampleInputEmail1"
                 placeholder="Enter email"
                 formControlName="email"
                 [readOnly]="usuario.google">
            </div>
          </div>



          <button type="submit"
           class="btn btn-success waves-effect waves-light m-r-10 btn-block"
           [disabled]="perfilForm.invalid">

           Guardar</button>

        </form>
      </div>
    </div>
  </div>

 <div class="col-md-6">
   <div class="card">
     <div class="card-body">
       <h4 class="card-title">Avatar</h4>
       <h6 class="card-subtitle">Imagen del usuario</h6>




       <!--clase 193 -->
          <!-- <div class="text-center">
               <img *ngIf="!imgTemp" [src]="usuario.imagenUrl" class="img-avatar">
               <img *ngIf="imgTemp" [src]="imgTemp" class="img-avatar">
          </div> -->
       <!--fin 193 -->


       <div class="card col-6" style="width: 18rem; left: 250px;">
         <img *ngIf="!imgTemp" [src]="usuario.imagenUrl" class="img-avatar">
         <img *ngIf="imgTemp" [src]="imgTemp" class="img-avatar">
         <div class="card-body">
           <h5 class="card-title">Perfil de: {{usuario.email}}</h5>
           <p class="card-text">{{usuario.nombre}}</p>

           <button type="button" class="btn btn-success btn-block waves-effect waves-light m-r-10"
             [disabled]="!imagenSubir" (click)="subirImagen()">
             <i class="fa fa-save"></i>
             Cambiar imagen
           </button>


         </div>
       </div>

       <input type="file" (change)="cambiarImagen($event.target.files[0])">

       <br>
       <br>

         <i class="fa fa-save"></i>
         Cambiar imagen

     </div>
   </div>
 </div>

</div>
