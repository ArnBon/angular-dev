<div class="row animated fadeIn fast">
  <div class="col-12">
    <div class="card">
      <div class="card-body">

        <input type="text" class="form-control" placeholder="Buscar médico..." #txtTermino
           />

      </div>
    </div>
  </div>
</div>

<div class="row animated fadeIn fast" >
  <div class="col-12">

    <div class="alert alert-info text-center">
      <h4 class="alert-heading">Cargando</h4>
      <i class="fa fa-spin fa-refresh fa-2x"></i>
      <p class="mb-0">Por favor espere</p>
    </div>

  </div>
</div>


<div class="row" >
  <div class="col-12">
    <div class="card">
      <div class="card-body">


        <div class="row">
          <div class="col-8">
            <h4 class="card-title">Medicos </h4>
            <h6 class="card-subtitle">
              Listado de Médicos
            </h6>
          </div>

          <div class="col">
            <div class="text-right">
              <a class="btn btn-primary" >
                <i class="fa fa-hospital-o"></i>
                Crear médico
              </a>
            </div>
          </div>

        </div>



        <div class="table-responsive">
          <table class="table table-bordered">
            <thead>
              <tr>
                <th class="w100">Foto</th>
                <th>Nombre</th>
                <th class="w100 text-nowrap">Acciones</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td class="text-center">
                  <img  [alt]="" class="w100 cursor"
                    >
                </td>
                <td>

                </td>

                <td class="text-nowrap text-center">
                  <a 
                  data-toggle="tooltip"
                    data-original-title="Editar">
                    <i class="fa fa-pencil text-inverse m-r-10"></i>
                  </a>

                  <a class="cursor" data-toggle="tooltip" data-original-title="Borrar" >
                    <i class="fa fa-close text-danger"></i>
                  </a>
                </td>
              </tr>

            </tbody>
          </table>
        </div>

                <button class="btn btn-secondary">Anteriores</button>
                &nbsp;
                <button class="btn btn-secondary">Siguientes</button>

      </div>
    </div>
  </div>
</div>
